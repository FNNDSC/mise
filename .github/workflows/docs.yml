name: Docs

# Builds the developer documentation site: asciidoctor guides whose code
# examples are tag-included from the live exemplars, plus the TypeDoc API
# reference for cumin, salsa, brasa and calypso. Deploys to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same exact npm version as CI and the lockfile (see ci.yml).
      - run: npm install -g npm@11.19.0
      - run: npm ci
      # TypeDoc resolves cross-package imports through each workspace
      # package's built entry point, so the build must precede it.
      - run: npm run build
      - run: npm run docs:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
