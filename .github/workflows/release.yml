name: Release

on:
  push:
    branches: [main]
  # Manual retry: publishing is idempotent (already-published versions are
  # skipped), so a failed publish can be re-attempted without a new commit.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # npm OIDC trusted publishing (tokenless publish with provenance).
      # Each @fnndsc package is configured on npmjs.com under Settings ->
      # Trusted Publisher as GitHub Actions, repository FNNDSC/mise,
      # workflow release.yml. npm >= 11.5 exchanges this OIDC token
      # automatically at publish time; no NPM_TOKEN secret exists to expire
      # mid-release.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Same exact npm version as CI and the lockfile (see ci.yml); npm 11.5+
      # is also the minimum for OIDC trusted publishing.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build
      # Opens/updates a "Version Packages" PR; when that PR is merged,
      # publishes the changed packages to npm in dependency order.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Temporary while validating OIDC trusted publishing: surfaces the
          # token-exchange requests in the log. Remove once a publish lands.
          NPM_CONFIG_LOGLEVEL: verbose
