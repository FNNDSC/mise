name: Release

on:
  push:
    branches: [main]
  # Manual retry: publishing is idempotent (already-published versions are
  # skipped), so a failed publish can be re-attempted without a new commit.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: a release's date in dist/notes.json is the
          # day its Version Packages merge landed (scripts/notes-build.mjs).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Same exact npm version as CI and the lockfile (see ci.yml); npm 11.5+
      # is also the minimum for OIDC trusted publishing.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run build
      # Opens/updates the "Version Packages" PR. It does not publish: this
      # repository's OIDC tokens carry GitHub's immutable subject since its
      # transfer to HARBOR-Medical-AI, which npm's trusted-publishing exchange
      # rejects (npm/cli#9969). The packages are published by
      # FNNDSC/chrisproject.org's publish-mise.yml, which `make publish` starts
      # after the merge and which every package names as its trusted publisher.
      # When npm accepts the immutable subject: rebind the packages here, give
      # this job `id-token: write` and `publish: npm run release` again.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
