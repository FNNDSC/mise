name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm OIDC trusted publishing (tokenless publish with
      # provenance). Activation: on npmjs.com, for EACH @fnndsc package,
      # Settings -> Trusted Publisher -> GitHub Actions with repository
      # FNNDSC/mise and workflow release.yml. Once every package is
      # configured, delete the NPM_TOKEN lines below and the repo secret;
      # npm >= 11.5 then authenticates via OIDC automatically and tokens can
      # never expire mid-release again.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Same npm major as CI and the lockfile; also the minimum for OIDC
      # trusted publishing.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      # Opens/updates a "Version Packages" PR; when that PR is merged,
      # publishes the changed packages to npm in dependency order.
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
