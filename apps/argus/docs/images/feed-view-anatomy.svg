<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" font-family="Antonio, 'Share Tech Mono', monospace">
  <title>Feed view anatomy</title>
  <rect width="1180" height="420" fill="#000"/>
  <!-- the two doors -->
  <rect x="30" y="24" width="250" height="34" rx="17" fill="#99ccff"/>
  <text x="52" y="47" font-size="16" fill="#000" font-weight="bold">RUNS ROSTER · OPEN A FEED</text>
  <rect x="30" y="72" width="250" height="34" rx="17" fill="#cc99ff"/>
  <text x="52" y="95" font-size="16" fill="#000" font-weight="bold">UNIVERSE · DESCEND INTO IT</text>
  <path d="M290 41 H350 V140 H380" stroke="#99ccff" stroke-width="3" fill="none"/>
  <path d="M290 89 H340 V150 H380" stroke="#cc99ff" stroke-width="3" fill="none"/>
  <text x="30" y="132" font-size="12" fill="#ccddff">two doors, one view: feedGraph_build (scene/feedGraph.ts)</text>
  <!-- the field: the feed as its tree, root on top -->
  <rect x="380" y="24" width="560" height="372" rx="24" fill="#000" stroke="#3a6fb0" stroke-width="2"/>
  <line x1="660" y1="80" x2="560" y2="190" stroke="#8899aa" stroke-width="7"/>
  <line x1="660" y1="80" x2="760" y2="190" stroke="#8899aa" stroke-width="7"/>
  <line x1="560" y1="190" x2="500" y2="300" stroke="#8899aa" stroke-width="7"/>
  <line x1="560" y1="190" x2="620" y2="300" stroke="#8899aa" stroke-width="7"/>
  <line x1="760" y1="190" x2="760" y2="300" stroke="#8899aa" stroke-width="7"/>
  <circle cx="660" cy="80" r="22" fill="#88bbaa"/>
  <circle cx="560" cy="190" r="18" fill="#c8d4dc"/>
  <circle cx="760" cy="190" r="18" fill="#c8d4dc"/>
  <circle cx="500" cy="300" r="16" fill="#c8d4dc"/>
  <circle cx="620" cy="300" r="26" fill="#cc4444"/>
  <text x="604" y="306" font-size="12" fill="#fff" font-weight="bold">×12</text>
  <circle cx="760" cy="300" r="16" fill="#c8d4dc"/>
  <text x="690" y="74" font-size="12" fill="#ccddff">root on top (RANKED)</text>
  <text x="400" y="380" font-size="12" fill="#ccddff">every node tubed · solid under SPHERES · points of light on fine threads under STARS</text>
  <!-- the frame: one verb set -->
  <rect x="960" y="24" width="190" height="372" rx="24" fill="#1f2a44"/>
  <g font-size="14" font-weight="bold" fill="#000">
    <rect x="972" y="40" width="166" height="24" rx="12" fill="#99ccff"/><text x="1092" y="57" text-anchor="end">BACK</text>
    <rect x="972" y="70" width="166" height="24" rx="12" fill="#99ccff"/><text x="1092" y="87" text-anchor="end">NOTE · TAG · RENAME</text>
    <rect x="972" y="104" width="166" height="24" rx="12" fill="#66ccff"/><text x="1092" y="121" text-anchor="end">RANKED</text>
    <rect x="972" y="134" width="166" height="24" rx="12" fill="#66ccff"/><text x="1092" y="151" text-anchor="end">3D</text>
    <rect x="972" y="164" width="166" height="24" rx="12" fill="#66ccff"/><text x="1092" y="181" text-anchor="end">SPHERES</text>
    <rect x="972" y="194" width="166" height="24" rx="12" fill="#335577"/><text x="1092" y="211" text-anchor="end" fill="#99ccff">PULSE OFF</text>
    <rect x="972" y="224" width="166" height="24" rx="12" fill="#66ccff"/><text x="1092" y="241" text-anchor="end">TIME</text>
    <rect x="972" y="254" width="166" height="24" rx="12" fill="#66ccff"/><text x="1092" y="271" text-anchor="end">SHAPE</text>
    <rect x="972" y="284" width="166" height="24" rx="12" fill="#335577"/><text x="1092" y="301" text-anchor="end" fill="#99ccff">GRAVITY OFF</text>
    <rect x="972" y="314" width="166" height="24" rx="12" fill="#66ccff"/><text x="1092" y="331" text-anchor="end">STATUS</text>
  </g>
  <text x="972" y="362" font-size="12" fill="#ccddff">[data-feed-verb] pills</text>
  <text x="972" y="380" font-size="12" fill="#ccddff">remembered: argus.feedview</text>
</svg>
