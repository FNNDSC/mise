<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" font-family="Antonio, 'DejaVu Sans Condensed', 'Arial Narrow', sans-serif">
  <title>Listing anatomy: the frame, the field, a block, its rows, the action track, and a level beneath an open row</title>
  <defs>
    <style>
      .bg { fill: #000; }
      .label { fill: #ffcc66; font-size: 13px; letter-spacing: 0.08em; }
      .num { fill: #000; font-size: 11px; font-weight: bold; text-anchor: middle; }
      .lead { stroke: #ffcc66; stroke-width: 1.2; fill: none; }
      .cap { fill: #ffcc66; }
      .capText { fill: #000; font-size: 12px; font-weight: bold; letter-spacing: 0.12em; }
      .cell { fill: #ffeecc; font-size: 13px; }
      .glyph { fill: #ffcc66; font-size: 13px; }
      .dim { fill: #cc8855; font-size: 13px; }
      .capsule { fill: #ffcc66; }
      .capsuleText { fill: #000; font-size: 11px; font-weight: bold; letter-spacing: 0.1em; }
      .readout { fill: #ffbb77; font-size: 11px; letter-spacing: 0.06em; }
      .rule { stroke: #ff7700; stroke-width: 2; }
      .strip { fill: #111; stroke: #cc8855; stroke-width: 1; }
      .stripText { fill: #ffcc66; font-size: 12px; letter-spacing: 0.1em; }
      .header { fill: #ff9944; font-size: 13px; letter-spacing: 0.06em; }
      .track { fill: none; stroke: #664422; stroke-width: 1; stroke-dasharray: 3 3; }
      .indicated { fill: #221a0a; }
      .selected { fill: #0a1a22; }
      .levelBox { fill: none; stroke: #cc8855; stroke-width: 1; stroke-dasharray: 4 3; }
      .mono { fill: #ffcc66; font-size: 11px; font-family: 'DejaVu Sans Mono', monospace; }
    </style>
  </defs>
  <rect class="bg" width="1180" height="600"/>

  <!-- ============================== the listing, 60..700 wide ============================== -->
  <!-- 1 grid host: the roster-cols property on the mount -->
  <rect x="60" y="40" width="640" height="530" fill="none" stroke="#ff7700" stroke-width="2"/>
  <text class="mono" x="70" y="34">--roster-cols: 1.4em 1fr 6em 7em 10em 12em</text>

  <!-- 2 frame: caps row -->
  <g transform="translate(70,52)">
    <rect class="cap" x="0" y="0" width="22" height="20" rx="10" ry="10"/>
    <rect class="cap" x="25" y="0" width="240" height="20"/>
    <text class="capText" x="34" y="14">NAME ▲</text>
    <rect class="cap" x="268" y="0" width="70" height="20"/>
    <text class="capText" x="292" y="14">SIZE</text>
    <rect class="cap" x="341" y="0" width="80" height="20"/>
    <text class="capText" x="366" y="14">DATE</text>
    <rect class="cap" x="424" y="0" width="90" height="20"/>
    <text class="capText" x="445" y="14">OWNER</text>
    <rect class="cap" x="517" y="0" width="103" height="20" rx="10" ry="10"/>
  </g>
  <!-- 3 strip -->
  <rect class="strip" x="70" y="80" width="620" height="22"/>
  <text class="stripText" x="78" y="95">FILTER :</text>
  <text class="cell" x="140" y="95">owner:chris</text>
  <line class="rule" x1="60" y1="112" x2="700" y2="112"/>

  <!-- 4 field, 5 block header -->
  <text class="header" x="70" y="132">/home/chris/uploads</text>
  <line x1="70" y1="138" x2="690" y2="138" stroke="#ff7700" stroke-width="1"/>

  <!-- rows: glyph 22 | name 240 | size 70 | date 80 | owner 90 | actions 103 ; x offsets 70,95,338,411,494,587 -->
  <!-- 6 lead row .. -->
  <g transform="translate(70,150)">
    <text class="glyph" x="4" y="14">▴</text>
    <text class="cell" x="25" y="14">..</text>
    <rect class="track" x="517" y="1" width="103" height="18"/>
  </g>
  <!-- 7 row, 8 cell -->
  <g transform="translate(70,174)">
    <text class="glyph" x="4" y="14">▸</text>
    <text class="cell" x="25" y="14">dicom</text>
    <text class="cell" x="341" y="14">2026-09-01</text>
    <text class="cell" x="424" y="14">chris</text>
    <rect class="track" x="517" y="1" width="103" height="18"/>
  </g>
  <!-- 9 indicated row, 10 action track with verbs, 11 readout -->
  <g transform="translate(70,198)">
    <rect class="indicated" x="-6" y="-3" width="632" height="24"/>
    <text class="glyph" x="4" y="14" fill="#ffeecc">·</text>
    <text class="cell" x="25" y="14" fill="#ffeecc">report.pdf</text>
    <text class="cell" x="268" y="14">1.2M</text>
    <text class="cell" x="341" y="14">2026-09-03</text>
    <text class="cell" x="424" y="14">chris</text>
    <rect class="capsule" x="517" y="1" width="46" height="18" rx="9"/>
    <text class="capsuleText" x="525" y="14">OPEN</text>
    <rect class="capsule" x="566" y="1" width="30" height="18" rx="9"/>
    <text class="capsuleText" x="573" y="14">RM</text>
    <text class="readout" x="600" y="14">r--</text>
  </g>
  <!-- 12 selected row -->
  <g transform="translate(70,222)">
    <rect class="selected" x="-6" y="-3" width="632" height="24"/>
    <text class="glyph" x="4" y="14">·</text>
    <text class="cell" x="25" y="14">notes.txt</text>
    <text class="cell" x="268" y="14">4.0K</text>
    <text class="cell" x="341" y="14">2026-08-30</text>
    <text class="cell" x="424" y="14">chris</text>
    <rect class="track" x="517" y="1" width="103" height="18"/>
  </g>
  <!-- 13 open row with 14 level beneath -->
  <g transform="translate(70,246)">
    <text class="glyph" x="4" y="14">▾</text>
    <text class="cell" x="25" y="14">study 1.2.840…</text>
    <text class="cell" x="341" y="14">2026-07-12</text>
    <text class="cell" x="424" y="14">chris</text>
    <rect class="track" x="517" y="1" width="103" height="18"/>
  </g>
  <g transform="translate(92,272)">
    <rect class="levelBox" x="-4" y="-4" width="606" height="96"/>
    <text class="mono" x="0" y="86" fill="#cc8855">--roster-cols: 1fr 6em 8em 7em (the level's own)</text>
    <rect class="cap" x="0" y="4" width="300" height="18" rx="9" ry="9"/>
    <text class="capText" x="10" y="17">SERIES</text>
    <rect class="cap" x="303" y="4" width="90" height="18"/>
    <text class="capText" x="312" y="17">MODALITY</text>
    <rect class="cap" x="396" y="4" width="90" height="18"/>
    <text class="capText" x="416" y="17">FILES</text>
    <rect class="cap" x="489" y="4" width="110" height="18" rx="9" ry="9"/>
    <text class="cell" x="6" y="44">T1 MPRAGE</text>
    <text class="cell" x="310" y="44">MR</text>
    <text class="cell" x="404" y="44">176</text>
    <rect class="capsule" x="492" y="32" width="42" height="17" rx="8"/>
    <text class="capsuleText" x="500" y="44">PULL</text>
    <text class="cell" x="6" y="66">FLAIR</text>
    <text class="cell" x="310" y="66">MR</text>
    <text class="cell" x="404" y="66">44</text>
    <rect class="capsule" x="492" y="54" width="42" height="17" rx="8"/>
    <text class="capsuleText" x="500" y="66">PULL</text>
  </g>
  <!-- a second block -->
  <text class="header" x="70" y="400">/home/chris/feeds</text>
  <line x1="70" y1="406" x2="690" y2="406" stroke="#ff7700" stroke-width="1"/>
  <g transform="translate(70,418)">
    <text class="glyph" x="4" y="14">▸</text>
    <text class="cell" x="25" y="14">feed_21</text>
    <text class="cell" x="341" y="14">2026-09-05</text>
    <text class="cell" x="424" y="14">chris</text>
    <rect class="track" x="517" y="1" width="103" height="18"/>
  </g>

  <!-- 15 state line, 16 selection bar (the pane's chrome, drawn outside the mount) -->
  <line class="rule" x1="60" y1="500" x2="700" y2="500"/>
  <text class="stripText" x="70" y="522">FILTER ON</text>
  <text class="stripText" x="150" y="522">SELECT ON</text>
  <rect class="capsule" x="240" y="509" width="56" height="18" rx="9"/>
  <text class="capsuleText" x="248" y="522">RM 2</text>
  <rect class="capsule" x="300" y="509" width="70" height="18" rx="9"/>
  <text class="capsuleText" x="308" y="522">MV -T…</text>
  <text class="dim" x="70" y="556">.pane-state:</text>
  <text class="cell" x="160" y="556">CWD · SELECT · FILTERED 6/41 · 2 SELECTED · 1 SHOWN</text>

  <!-- ============================== labels, numbered, right column ============================== -->
  <g id="labels">
    <!-- helper: circle number + text -->
    <g transform="translate(720,40)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">1</text>
      <text class="label" x="24" y="4">grid host: --roster-cols written by the façade</text>
    </g>
    <g transform="translate(720,66)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">2</text>
      <text class="label" x="24" y="4">frame › caps: blank over the glyph, lit cap = sort</text>
    </g>
    <g transform="translate(720,92)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">3</text>
      <text class="label" x="24" y="4">frame › filter strip (FILTER, or the language)</text>
    </g>
    <g transform="translate(720,118)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">4</text>
      <text class="label" x="24" y="4">field: scrolls; the frame does not</text>
    </g>
    <g transform="translate(720,144)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">5</text>
      <text class="label" x="24" y="4">block header (one block per listed directory)</text>
    </g>
    <g transform="translate(720,170)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">6</text>
      <text class="label" x="24" y="4">lead row: outside the order, one click, no verbs</text>
    </g>
    <g transform="translate(720,196)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">7</text>
      <text class="label" x="24" y="4">row: a grid on --roster-cols, one cell per trait</text>
    </g>
    <g transform="translate(720,222)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">8</text>
      <text class="label" x="24" y="4">indicated row: .listing-indicated, its verbs shown</text>
    </g>
    <g transform="translate(720,248)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">9</text>
      <text class="label" x="24" y="4">action track: reserved on EVERY row, one height</text>
    </g>
    <g transform="translate(720,274)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">10</text>
      <text class="label" x="24" y="4">readout: beside the indicated row's verbs</text>
    </g>
    <g transform="translate(720,300)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">11</text>
      <text class="label" x="24" y="4">selected row: .listing-selected, kept by field</text>
    </g>
    <g transform="translate(720,326)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">12</text>
      <text class="label" x="24" y="4">open row: .listing-open, its level follows</text>
    </g>
    <g transform="translate(720,352)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">13</text>
      <text class="label" x="24" y="4">level: child caps per open row, own grid,</text>
      <text class="label" x="24" y="20">one filter read down; verbs `always` here</text>
    </g>
    <g transform="translate(720,394)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">14</text>
      <text class="label" x="24" y="4">second block, same caps, same order</text>
    </g>
    <g transform="translate(720,440)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">15</text>
      <text class="label" x="24" y="4">mode frame: FILTER and SELECT blocks read state;</text>
      <text class="label" x="24" y="20">the selection bar carries the selection's verbs</text>
    </g>
    <g transform="translate(720,486)">
      <circle cx="8" cy="0" r="9" fill="#ffcc66"/><text class="num" x="8" y="4">16</text>
      <text class="label" x="24" y="4">state line: composed from typed parts, a pane</text>
      <text class="label" x="24" y="20">may prepend (CWD) or stay silent (null)</text>
    </g>
  </g>

  <!-- leader lines from numbers to parts -->
  <line class="lead" x1="712" y1="40" x2="700" y2="40"/>
  <line class="lead" x1="712" y1="66" x2="690" y2="62"/>
  <line class="lead" x1="712" y1="92" x2="690" y2="91"/>
  <line class="lead" x1="712" y1="118" x2="696" y2="118"/>
  <line class="lead" x1="712" y1="144" x2="694" y2="132"/>
  <line class="lead" x1="712" y1="170" x2="690" y2="160"/>
  <line class="lead" x1="712" y1="196" x2="690" y2="184"/>
  <line class="lead" x1="712" y1="222" x2="696" y2="209"/>
  <line class="lead" x1="712" y1="248" x2="690" y2="216"/>
  <line class="lead" x1="712" y1="274" x2="672" y2="212"/>
  <line class="lead" x1="712" y1="300" x2="696" y2="233"/>
  <line class="lead" x1="712" y1="326" x2="690" y2="256"/>
  <line class="lead" x1="712" y1="352" x2="694" y2="300"/>
  <line class="lead" x1="712" y1="394" x2="690" y2="428"/>
  <line class="lead" x1="712" y1="440" x2="690" y2="518"/>
  <line class="lead" x1="712" y1="486" x2="690" y2="552"/>
</svg>
