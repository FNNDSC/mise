<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="Antonio, 'Share Tech Mono', monospace">
  <title>Notes pane anatomy</title>
  <rect width="1180" height="520" fill="#000"/>
  <!-- the bar -->
  <rect x="20" y="20" width="1140" height="34" rx="17" fill="#55aaff"/>
  <text x="44" y="43" font-size="18" fill="#000" font-weight="bold">NOTES</text>
  <text x="840" y="43" font-size="13" fill="#000" font-style="italic">DAEMON · argus 0.24.1 · brasa 0.32.1</text>
  <text x="44" y="78" font-size="12" fill="#ffcc99">.pane-handle · .pane-title · .pane-state (the release read: the daemon's installed versions)</text>
  <!-- the frame -->
  <rect x="20" y="92" width="1140" height="30" rx="4" fill="none" stroke="#ffcc99" stroke-dasharray="4 3"/>
  <rect x="34" y="97" width="118" height="20" rx="10" fill="#ff9966"/>
  <text x="44" y="111" font-size="11" fill="#000">LATEST RELEASE</text>
  <rect x="160" y="97" width="98" height="20" rx="10" fill="#444"/>
  <text x="170" y="111" font-size="11" fill="#ccc">INTERNAL OFF</text>
  <rect x="266" y="97" width="86" height="20" rx="10" fill="#ff9966"/>
  <text x="278" y="111" font-size="11" fill="#000">FILTER OFF</text>
  <text x="366" y="111" font-size="12" fill="#ffcc99">.mode-frame · .notes-since (1 → 5 → ALL, asked of the kernel) · .notes-internal · .notes-filter</text>
  <!-- caps -->
  <rect x="20" y="134" width="1140" height="22" fill="#cc99cc"/>
  <text x="34" y="150" font-size="12" fill="#000" font-weight="bold">PACKAGE</text>
  <text x="140" y="150" font-size="12" fill="#000" font-weight="bold">CHANGE</text>
  <text x="900" y="150" font-size="11" fill="#000">.listing-caps (sortable)</text>
  <!-- block head: a release -->
  <text x="34" y="182" font-size="12" fill="#ffcc99">2026-10-05 · argus 0.24.1 · brasa 0.32.1</text>
  <text x="700" y="182" font-size="11" fill="#ffcc99">.notes-block-head (one per release: the day, every package that moved)</text>
  <!-- rows -->
  <text x="34" y="210" font-size="13" fill="#ffff99">argus</text>
  <text x="140" y="210" font-size="13" fill="#ffcc66">sl flies the Enterprise.</text>
  <text x="34" y="236" font-size="13" fill="#ffff99">brasa</text>
  <text x="140" y="236" font-size="13" fill="#ffcc66">Bare help has a Games and utilities group. ▸</text>
  <text x="700" y="236" font-size="11" fill="#ffcc99">.notes-row.notes-row-more: a press unfolds the rest</text>
  <text x="160" y="262" font-size="13" fill="#999">General keeps help, date, exit and !.</text>
  <text x="700" y="262" font-size="11" fill="#ffcc99">.notes-row-body: the rest, beneath its headline</text>
  <text x="34" y="288" font-size="13" fill="#666">brasa</text>
  <text x="140" y="288" font-size="13" fill="#666">Internal: coverage.</text>
  <text x="700" y="288" font-size="11" fill="#ffcc99">.notes-row-internal: shown only with INTERNAL ON</text>
  <!-- next release -->
  <text x="34" y="330" font-size="12" fill="#ffcc99">2026-10-04 · argus 0.24.0 · brasa 0.32.0</text>
  <text x="34" y="358" font-size="13" fill="#ffff99">argus</text>
  <text x="140" y="358" font-size="13" fill="#ffcc66">The games shelf on the stage. ▸</text>
  <text x="40" y="420" font-size="12" fill="#ffcc99">The rows are the kernel's `notes` answer (session.notes), never written here; the pane names the release it reads on its bar.</text>
  <rect x="1120" y="134" width="40" height="300" fill="#55aaff"/>
  <text x="1128" y="300" font-size="11" fill="#000" transform="rotate(-90 1128 300)">spine</text>
</svg>
