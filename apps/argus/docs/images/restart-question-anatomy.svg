<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" font-family="Antonio, 'Share Tech Mono', monospace">
  <title>Restart question anatomy</title>
  <rect width="1180" height="360" fill="#000"/>
  <!-- the header's door pills -->
  <rect x="820" y="20" width="120" height="26" rx="13" fill="#ffcc99"/>
  <text x="845" y="39" font-size="15" fill="#000" font-weight="bold">RESTART</text>
  <rect x="950" y="20" width="120" height="26" rx="13" fill="#ff9900"/>
  <text x="975" y="39" font-size="15" fill="#000" font-weight="bold">LOG OUT</text>
  <text x="820" y="66" font-size="12" fill="#ffcc99">#restart-pill · #door-pill (only behind a door)</text>
  <!-- the question in the notice's spot -->
  <rect x="120" y="90" width="900" height="150" rx="22" fill="#000" stroke="#ff9966" stroke-width="2"/>
  <text x="148" y="126" font-size="18" fill="#ffeecc">Restart the calypso daemon? You'll stay logged in; the page reloads when the new daemon is up.</text>
  <text x="148" y="158" font-size="17" fill="#ffeecc">This will cut off:</text>
  <text x="160" y="184" font-size="16" fill="#ffeecc">• the running command: pacs pull 22119730</text>
  <text x="160" y="208" font-size="16" fill="#ffeecc">• an unsaved edit in me.txt   • 1 other browser, which will be disconnected</text>
  <rect x="846" y="108" width="70" height="28" rx="14" fill="#ffeecc"/>
  <text x="864" y="128" font-size="16" fill="#000" font-weight="bold">YES</text>
  <rect x="926" y="108" width="70" height="28" rx="14" fill="#ff9900"/>
  <text x="946" y="128" font-size="16" fill="#000" font-weight="bold">NO</text>
  <text x="120" y="268" font-size="12" fill="#ffcc99">.stale-page.restart-question · .stale-page-words (the sentence) · .restart-cuts (only what applies now) · .restart-answers (.restart-yes focused · .restart-no)</text>
  <text x="120" y="292" font-size="12" fill="#55aaff">Enter = YES · Esc = NO · neither reaches the stage</text>
  <text x="120" y="324" font-size="12" fill="#ffcc99">after YES: POST …/restart → the greeter → back in · another browser: .restart-said "The calypso daemon is restarting (asked from another browser or surface). Following it…"</text>
</svg>
