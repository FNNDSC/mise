<text x="800.0" y="164.0" fill="#8a9aa8" font-size="13" text-anchor="start" font-weight="normal">drifts toward its closest kin:</text>
<text x="800.0" y="188.0" fill="#f2c14e" font-size="13" text-anchor="start" font-weight="normal">  h = 0.65·ŵ + 0.35·unit(kin − x)</text>
<text x="800.0" y="212.0" fill="#8a9aa8" font-size="13" text-anchor="start" font-weight="normal">touching a stranger (A): sticks with</text>
<text x="800.0" y="236.0" fill="#f2c14e" font-size="13" text-anchor="start" font-weight="normal">  p = max(0.01, L) — else pushed off</text>
<text x="800.0" y="260.0" fill="#8a9aa8" font-size="13" text-anchor="start" font-weight="normal">touching kin (B): L = 1, it sticks</text>
<text x="800.0" y="284.0" fill="#8a9aa8" font-size="13" text-anchor="start" font-weight="normal"></text>
<text x="800.0" y="308.0" fill="#f2c14e" font-size="13" text-anchor="start" font-weight="normal">L(a,b) = Σ_{a∩b} w / Σ_{a∪b} w,  w = ln(N/n_p)</text>
<text x="800.0" y="332.0" fill="#8a9aa8" font-size="13" text-anchor="start" font-weight="normal">400 steps, then a free place by its kin</text>
