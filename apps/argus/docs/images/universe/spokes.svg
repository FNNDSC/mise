<text x="330.0" y="254.0" fill="#e8f4ff" font-size="12" text-anchor="middle" font-weight="normal">hub</text>
<text x="330.0" y="470.0" fill="#8a9aa8" font-size="13" text-anchor="middle" font-weight="normal">SPOKES — one shape's 40 feeds round its ghost hub</text>
<text x="700.0" y="120.0" fill="#f2c14e" font-size="13" text-anchor="start" font-weight="normal">shell = max(r_hub + 2, √n · r̄ · 1.6)</text>
<text x="700.0" y="144.0" fill="#f2c14e" font-size="13" text-anchor="start" font-weight="normal">stagger_k = 0.35 + 0.65 · frac(k · φ⁻¹)</text>
<text x="700.0" y="168.0" fill="#f2c14e" font-size="13" text-anchor="start" font-weight="normal">d_k = r_hub + 1.4 + shell · stagger_k</text>
<text x="700.0" y="192.0" fill="#f2c14e" font-size="13" text-anchor="start" font-weight="normal">direction_k = fibonacci shell point k of n</text>
<text x="700.0" y="216.0" fill="#f2c14e" font-size="13" text-anchor="start" font-weight="normal">each feed turned so its root faces the hub</text>
<text x="700.0" y="240.0" fill="#8a9aa8" font-size="13" text-anchor="start" font-weight="normal"></text>
<text x="700.0" y="264.0" fill="#8a9aa8" font-size="13" text-anchor="start" font-weight="normal">GALAXY starts here, then lets go:</text>
<text x="700.0" y="288.0" fill="#8a9aa8" font-size="13" text-anchor="start" font-weight="normal">charge −6(r/0.55)², springs r_s+r_t+1.4,</text>
<text x="700.0" y="312.0" fill="#8a9aa8" font-size="13" text-anchor="start" font-weight="normal">collide 1.2r, gravity 0.08(r/0.55)² to 0,</text>
<text x="700.0" y="336.0" fill="#8a9aa8" font-size="13" text-anchor="start" font-weight="normal">80 ticks at α = 0.6</text>
</svg>
